name: Android build

# Builds daevis.apk (the Galaxy/Android app) on every change to the app or the shared screen,
# and keeps it as a workflow artifact. Nothing is published to Releases from here.
on:
  push:
    paths:
      - 'android/**'
      - 'desktop/ui/**'
      - '.github/workflows/android-build.yml'
  workflow_dispatch:

jobs:
  apk:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      # The same signing key for every build (repository secrets), so Android installs each APK as an update.
      - name: Signing key
        env:
          KEYSTORE_B64: ${{ secrets.DAEVIS_ANDROID_KEYSTORE_B64 }}
        run: |
          test -n "$KEYSTORE_B64" || { echo 'DAEVIS_ANDROID_KEYSTORE_B64 secret is missing'; exit 1; }
          echo "$KEYSTORE_B64" | base64 -d > "$RUNNER_TEMP/release.jks"

      - name: Test and build
        env:
          DAEVIS_KEYSTORE: ${{ runner.temp }}/release.jks
          DAEVIS_KEY_PASS: ${{ secrets.DAEVIS_ANDROID_KEY_PASS }}
        run: python3 android/build.py --out build/android --version-code ${{ github.run_number }} --version-name 0.1.${{ github.run_number }}

      - uses: actions/upload-artifact@v4
        with:
          name: daevis-apk
          path: build/android/daevis.apk
          retention-days: 30

  # Installs the APK on an emulator, opens it and keeps a screenshot; fails on a crash.
  publish:
    needs: [apk, smoke]
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: daevis-apk
      - name: Publish tested update to private phone relay
        env:
          PUBLISH_TOKEN: ${{ secrets.DAEVIS_ANDROID_PUBLISH_TOKEN }}
          UPDATE_URL: ${{ secrets.DAEVIS_ANDROID_UPDATE_URL }}
        run: |
          test -n "$PUBLISH_TOKEN" && test -n "$UPDATE_URL"
          curl --fail --silent --show-error --max-time 90 \
            -H "Authorization: Bearer $PUBLISH_TOKEN" \
            -H "X-Daevis-Version: ${{ github.run_number }}" \
            -H 'Content-Type: application/vnd.android.package-archive' \
            --data-binary @daevis.apk "$UPDATE_URL/phone/update/publish"

  smoke:
    needs: apk
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: daevis-apk
      - name: Enable KVM
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules && sudo udevadm trigger --name-match=kvm
      - uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 34
          # This app has no Play Services dependency. AOSP avoids unrelated GMS font-provider deaths killing WebView clients.
          target: default
          arch: x86_64
          disable-animations: true
          script: |
            sleep 45
            adb install -r daevis.apk
            adb logcat -c
            adb shell am start -W -n io.daevis.app/.MainActivity
            sleep 15
            adb exec-out screencap -p > first-screen.png
            adb logcat -d > logcat.txt
            ! grep -E "FATAL EXCEPTION|AndroidRuntime: Process: io.daevis.app" logcat.txt
            adb shell pidof io.daevis.app
            adb shell cmd role add-role-holder android.app.role.ASSISTANT io.daevis.app
            adb shell cmd role get-role-holders android.app.role.ASSISTANT | tee assistant-role.txt
            grep -q io.daevis.app assistant-role.txt
            adb shell am start -W -a android.intent.action.ASSIST
            adb shell cmd statusbar add-tile io.daevis.app/.TalkTile
            adb shell cmd statusbar click-tile io.daevis.app/.TalkTile
            sleep 3
            adb shell pidof io.daevis.app
            adb logcat -d > logcat-after.txt
            ! grep -E "FATAL EXCEPTION" logcat-after.txt
            grep -iE "chromium|console" logcat.txt | grep -i "io.daevis\|Uncaught" | head -20 || true
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: daevis-smoke
          path: |
            first-screen.png
            logcat.txt
            logcat-after.txt
            assistant-role.txt
          retention-days: 7
